name: Sync online giveaways

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-online-giveaways]

permissions:
  contents: write

concurrency:
  group: sync-online-giveaways
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync from online page
        run: npm run sync:online

      - name: Build
        run: npm run build:pages

      - name: Commit synced data
        run: |
          if git diff --quiet -- src/app/giveaway-data.ts; then
            echo "No giveaway data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/giveaway-data.ts
          git commit -m "Sync online giveaway data"
          git pull --rebase origin main
          git push
