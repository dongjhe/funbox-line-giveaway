name: Sync online giveaways

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-online-giveaways]

permissions:
  contents: write

concurrency:
  group: sync-online-giveaways
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Force latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "Running sync from $(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate online page has products
        run: npm run sync:online -- --dry-run

      - name: Sync from online page
        run: npm run sync:online

      - name: Build
        run: npm run build:pages

      - name: Commit synced data
        run: |
          if git diff --quiet -- src/app/giveaway-data.ts; then
            echo "No giveaway data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/giveaway-data.ts
          git commit -m "Sync online giveaway data"

          # Do not rebase a generated data commit onto a newer main: rerun instead.
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            echo "main changed while sync was running; refusing stale sync commit."
            exit 1
          fi

          git push origin HEAD:main
